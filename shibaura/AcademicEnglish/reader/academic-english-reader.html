<title>AcademicEnglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: paragraph rows, English left / Japanese right, sentence-linked highlight; stacks on phones */
:root {
  --bg: #F6F7F9;
  --paper: #FFFFFF;
  --fg: #1C2331;
  --muted: #5E6878;
  --line: #DDE2EA;
  --accent: #2A55B8;
  --marker: #FFE27A;
  --marker-soft: #FFF3C2;
  --true: #1E7A4C;
  --false: #B3261E;
  --f-en: Calibri, "Carlito", "Segoe UI", sans-serif;
  --f-ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151C; --paper: #181D26; --fg: #E3E7EE; --muted: #9AA4B4; --line: #2A3140;
    --accent: #8EAEFF; --marker: rgba(255, 210, 80, .38); --marker-soft: rgba(255, 210, 80, .14);
    --true: #6FD3A0; --false: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151C; --paper: #181D26; --fg: #E3E7EE; --muted: #9AA4B4; --line: #2A3140;
  --accent: #8EAEFF; --marker: rgba(255, 210, 80, .38); --marker-soft: rgba(255, 210, 80, .14);
  --true: #6FD3A0; --false: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-en); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); line-height: 1.2; text-wrap: balance; }
.hint { margin: 0; color: var(--muted); font-family: var(--f-ja); font-size: 14px; }
.units button { all: unset; cursor: pointer; font-size: 14px; font-weight: 700; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.units button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.units button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qja { display: block; font-family: var(--f-ja); font-size: 13px; color: var(--muted); }
#passages, #quizzes { display: grid; gap: 28px; }
.quiz { scroll-margin-top: 16px; }
.quiz h2 .ja-title { font-family: var(--f-ja); font-size: 14px; font-weight: 400; color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
.solver { background: var(--paper); border: 2px solid var(--accent); border-radius: 10px; padding-block: 20px; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: 10px; scroll-margin-top: 16px; }
.sv-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.sv-head h2 { margin: 0; font-size: 20px; font-family: var(--f-ja); }
.sv-label { font-size: 13px; color: var(--muted); font-family: var(--f-ja); }
#sv-text { width: 100%; font: 15px/1.6 var(--f-en); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical; }
#sv-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sv-spacer { flex: 1; }
.sv-file { font-family: var(--f-ja); font-size: 14px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.sv-file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.sv-file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.sv-files { font-size: 13px; color: var(--muted); font-family: var(--f-ja); min-width: 0; }
.sv-btn { font-family: var(--f-ja); font-size: 15px; font-weight: 700; padding: 7px 22px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); cursor: pointer; }
.sv-btn.ghost { background: transparent; color: var(--accent); font-weight: 500; padding-inline: 14px; }
.sv-btn:disabled { opacity: .5; cursor: default; }
.sv-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sv-status { margin: 0; min-height: 1.4em; font-family: var(--f-ja); font-size: 14px; color: var(--muted); }
.sv-out { display: grid; gap: 12px; }
.sv-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.sv-q { font-weight: 700; }
.sv-qja, .sv-why { font-family: var(--f-ja); font-size: 14px; color: var(--muted); }
.sv-why { color: var(--fg); }
.sv-ans { font-size: 17px; }
.sv-ans b { color: var(--true); }
.sv-ans .ja { display: inline; font-size: 14px; color: var(--muted); }
.sv-ev { display: grid; gap: 6px; }
.sv-ev button { all: unset; box-sizing: border-box; cursor: pointer; border-left: 3px solid var(--marker); background: var(--marker-soft); padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 14px; line-height: 1.5; }
.sv-ev button:hover, .sv-ev button:focus-visible { background: var(--marker); }
.sv-ev button:focus-visible { outline: 2px solid var(--accent); }
.sv-ev small { display: block; font-family: var(--f-ja); color: var(--muted); font-size: 12px; }
.sv-none { font-family: var(--f-ja); font-size: 13px; color: var(--false); }
nav a { font-size: 14px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; background: var(--paper); }
nav a:hover, nav a:focus-visible { border-color: var(--accent); }

section.passage { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding-block: 24px; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: 18px; scroll-margin-top: 16px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.p-head h2 { margin: 0; font-size: 22px; }
.p-head .ja-title { font-family: var(--f-ja); color: var(--muted); font-size: 15px; }
.colhead { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; padding-block: 6px; }
.row + .row { border-top: 1px dashed var(--line); padding-top: 14px; }
.en, .ja { margin: 0; min-width: 0; }
.en { font-size: 17px; line-height: 1.7; }
.ja { font-family: var(--f-ja); font-size: 15px; line-height: 1.9; color: var(--fg); }
.pn { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }

.s { border-radius: 3px; cursor: pointer; transition: background-color .12s ease, box-shadow .12s ease; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.s:hover { background: var(--marker-soft); }
.s.on { background: var(--marker); box-shadow: 0 0 0 2px var(--marker); }
.s:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.s.pinned { box-shadow: 0 0 0 2px var(--marker), inset 0 -2px 0 var(--accent); }

.q { display: inline-block; font-family: var(--f-en); font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 5px; margin: 0 3px; border-radius: 4px; vertical-align: 2px; color: var(--paper); background: var(--accent); }
.q.t { background: var(--true); }
.q.f { background: var(--false); }

.quiz { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding-block: 20px; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: 12px; }
.quiz h2 { margin: 0; font-size: 20px; }
.quiz ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.quiz button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 44px minmax(64px,auto) minmax(0,1fr); gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.quiz button:hover, .quiz button:focus-visible { background: var(--marker-soft); }
.quiz button:focus-visible { outline: 2px solid var(--accent); }
.quiz .num { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.quiz .ans { font-weight: 700; }
.quiz .ans.t { color: var(--true); }
.quiz .ans.f { color: var(--false); }
.quiz .txt { min-width: 0; }
.qprompt { margin: 0; display: grid; gap: 4px; padding: 10px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.qprompt .en { font-size: 15px; line-height: 1.6; }
.qprompt .ja { font-size: 13px; line-height: 1.7; color: var(--muted); }

@media (max-width: 760px) {
  .colhead { display: none; }
  .row { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .ja { padding-left: 12px; border-left: 3px solid var(--line); }
  .quiz button { grid-template-columns: 40px minmax(52px,auto) minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) { .s { transition: none; } html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
</style>

<div class="wrap">
  <header>
    <nav class="units" id="units" aria-label="Unit"></nav>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="utitle"></h1>
    <p class="hint">英文（または和訳）にカーソルを当てると、対応する文が強調されます。クリック／タップで固定、もう一度押すと解除。<span class="q t">Q1</span> は問題の根拠です（緑 = True、赤 = False、青 = それ以外の問題）。</p>
    <nav id="jump" aria-label="セクション"></nav>
  </header>
  <div id="passages"></div>
  <div id="quizzes"></div>
  <section class="solver" id="solver">
    <div class="sv-head">
      <h2>テスト問題を解く</h2>
      <span class="ja-title" id="sv-scope"></span>
    </div>
    <p class="hint">問題文を貼り付ける（または画面の画像を追加する）と、このUnitの本文から答えと根拠を探します。根拠を押すと本文のその文が強調されます。</p>
    <label class="sv-label" for="sv-text">問題文</label>
    <textarea id="sv-text" rows="7" placeholder="例）Q1. According to the passage, why is academic English important for engineering students?&#10;(a) ... (b) ... (c) ..."></textarea>
    <div class="sv-row">
      <label class="sv-file" id="sv-file-wrap" hidden>画像を追加<input type="file" id="sv-file" accept="image/*" multiple></label>
      <span class="sv-files" id="sv-files"></span>
      <span class="sv-spacer"></span>
      <button type="button" class="sv-btn ghost" id="sv-clear">クリア</button>
      <button type="button" class="sv-btn ghost" id="sv-stop" hidden>停止</button>
      <button type="button" class="sv-btn" id="sv-go">解く</button>
    </div>
    <p class="sv-status" id="sv-status" role="status"></p>
    <div id="sv-out" class="sv-out"></div>
  </section>
</div>

<script>
// Add one object per class. passages: sentence pairs [en, ja, [quiz ids]] (start: first ¶ number);
// quizzes: { title, short, ja, prompt: [[en, ja], ...] (the handout's question text), items: [question, answer, ja, id] }
const UNITS = [
  { id: "u1", label: "Unit 1", title: "Academic English Proficiency and Research Paper Writing",
    passages: [
  { id: "p11", title: "Reading Passage 1.1　Academic English Proficiency", ja: "アカデミック英語の運用能力", paras: [
    [
      ["Academic English proficiency is essential for engineering and science majors, as it supports both academic achievement and professional development.", "アカデミック英語の運用能力は、工学・理学を専攻する学生にとって不可欠である。学業上の成果と職業上の成長の両方を支えるからである。", [1]],
      ["In university settings, students must read and understand complex technical materials, write research papers, and communicate their ideas clearly in written and spoken forms.", "大学では、学生は複雑な技術資料を読んで理解し、研究論文を書き、自分の考えを文章と口頭の両方で明確に伝えなければならない。"],
      ["Strong academic English skills enable students to engage with international research communities, where English is the dominant language of scholarly communication.", "高いアカデミック英語力があれば、英語が学術コミュニケーションの主要言語である国際的な研究コミュニティに参加できる。", [2]]
    ],
    [
      ["In research paper writing, academic English plays a central role in structuring and presenting knowledge effectively.", "研究論文の執筆において、アカデミック英語は知識を効果的に構成し提示するうえで中心的な役割を果たす。"],
      ["Students are expected to organize their papers into clear sections—such as introduction, methodology, results, and discussion—while maintaining logical coherence and clarity.", "学生は、論理的な一貫性と明確さを保ちながら、序論・方法・結果・考察といった明確な章立てで論文を構成することが求められる。", [3]],
      ["They must develop evidence-based arguments, use appropriate technical vocabulary, and follow academic conventions such as citation and referencing.", "また、根拠に基づく議論を展開し、適切な専門用語を使い、引用や参考文献の記載といった学術的慣習に従わなければならない。"],
      ["Precision and objectivity are particularly important, as research writing requires accurate description of methods, careful interpretation of data, and avoidance of ambiguity.", "研究論文では方法の正確な記述、データの慎重な解釈、あいまいさの回避が求められるため、正確さと客観性が特に重要である。"],
      ["In addition, the use of hedging expressions (e.g., “This result suggests that…”) allows writers to present claims cautiously and appropriately within the academic context.", "さらに、ヘッジング表現（例：「この結果は…を示唆している」）を使うことで、書き手は学術的な文脈の中で主張を慎重かつ適切に示すことができる。", [5]]
    ],
    [
      ["Academic English is also crucial for delivering effective academic presentations.", "アカデミック英語は、効果的な学術発表を行ううえでも極めて重要である。"],
      ["In conferences, seminars, and classroom settings, students and researchers must present their findings in a clear, structured, and engaging manner.", "学会、セミナー、授業などの場で、学生や研究者は研究成果を明確で、構成がしっかりした、聞き手を引きつける形で発表しなければならない。"],
      ["This includes explaining complex concepts, guiding the audience through visual materials such as slides or graphs, and responding to questions.", "これには、複雑な概念を説明すること、スライドやグラフなどの視覚資料を使って聴衆を導くこと、質問に答えることが含まれる。", [6, 7]],
      ["Effective presentation skills require not only language proficiency but also the ability to organize information logically, emphasize key points, and adapt explanations to different audiences.", "効果的な発表には語学力だけでなく、情報を論理的に整理し、要点を強調し、聴衆に応じて説明を調整する能力も必要である。"],
      ["These skills are essential for sharing research outcomes and participating in scholarly discussions.", "こうした能力は、研究成果を共有し、学術的な議論に参加するために欠かせない。"]
    ],
    [
      ["Beyond academia, academic English proficiency is highly valuable in the professional workplace.", "学術の場を超えて、アカデミック英語の運用能力は職場でも非常に価値がある。", [1]],
      ["In many engineering and scientific fields, English functions as the global lingua franca, especially in multinational companies and international research collaborations.", "多くの工学・科学分野、特に多国籍企業や国際共同研究では、英語が世界共通語として機能している。", [8]],
      ["Professionals are often required to write technical reports, project documentation, emails, and proposals in English, as well as to participate in meetings and deliver presentations.", "専門職の人々は、技術報告書、プロジェクト資料、メール、提案書を英語で書き、会議に参加し、プレゼンテーションを行うことがしばしば求められる。", [8]],
      ["The ability to communicate clearly and precisely helps prevent misunderstandings, ensures efficient collaboration, and enhances the credibility of individuals and organizations.", "明確かつ正確にコミュニケーションをとる能力は、誤解を防ぎ、効率的な協働を確かなものにし、個人や組織の信頼性を高める。", [10]],
      ["Moreover, employees who possess strong academic English skills are better prepared to interpret technical information, contribute to innovation, and work effectively in global teams.", "さらに、高いアカデミック英語力を持つ社員は、技術情報を解釈し、イノベーションに貢献し、グローバルなチームで効果的に働くための準備がよりできている。", [10]]
    ],
    [
      ["Academic English is characterized by a formal tone, precise vocabulary, and a logical, well-organized structure.", "アカデミック英語の特徴は、フォーマルな口調、正確な語彙、そして論理的でよく整理された構成である。", [9]],
      ["It emphasizes clarity, objectivity, and critical thinking, making it suitable for scholarly and professional communication.", "明確さ、客観性、批判的思考を重視するため、学術的・職業的なコミュニケーションに適している。", [9]],
      ["Writers are expected to avoid informal expressions and instead use discipline-specific terminology and carefully constructed sentences.", "書き手はくだけた表現を避け、分野特有の専門用語と注意深く組み立てた文を使うことが求められる。", [4]],
      ["Ideas are typically developed in coherent paragraphs with clear transitions, allowing readers or listeners to follow complex arguments with ease.", "考えは通常、明確なつなぎを持つ一貫した段落の中で展開され、読み手や聞き手が複雑な議論を容易に追えるようになっている。"]
    ],
    [
      ["Key features of academic English include the use of evidence-based reasoning, proper citation of sources, and a critical approach to evaluating information.", "アカデミック英語の主な特徴には、根拠に基づく推論、出典の適切な引用、情報を批判的に評価する姿勢がある。"],
      ["Whether in research papers, presentations, or workplace communication, accuracy and clarity are essential.", "研究論文でも、発表でも、職場でのコミュニケーションでも、正確さと明確さが不可欠である。"],
      ["Mastery of academic English enables students not only to succeed in their studies but also to transition smoothly into professional environments, where effective communication is a key factor in career advancement and international collaboration.", "アカデミック英語を習得すれば、学生は学業で成功するだけでなく、効果的なコミュニケーションがキャリアアップと国際協力の重要な要素となる職業の世界へ、スムーズに移行できるようになる。"]
    ]
  ]},
  { id: "p12", title: "Reading Passage 1.2　Research Paper Writing", ja: "研究論文の執筆", paras: [
    [
      ["Research paper writing is the process of composing a scholarly document that explores, analyzes, and presents an in-depth examination of a specific topic or question.", "研究論文の執筆とは、特定のテーマや問いを探究・分析し、掘り下げた考察として示す学術文書を書く過程である。"],
      ["In the field of academic writing in English, it involves gathering and evaluating relevant information from credible sources, formulating a thesis or research question, and presenting findings in a structured and coherent manner.", "英語のアカデミック・ライティングの分野では、信頼できる情報源から関連情報を集めて評価し、主張（テーゼ）や研究課題を設定し、得られた知見を構造的かつ一貫した形で示すことが含まれる。"],
      ["Research paper writing is essential for advancing knowledge in various fields by providing evidence-based insights and contributing to ongoing scholarly discussions.", "研究論文の執筆は、根拠に基づく洞察を提供し、進行中の学術的議論に貢献することで、さまざまな分野の知識を前進させるために不可欠である。"]
    ],
    [
      ["The process of writing a research paper includes several key stages: first, identifying a research problem or question; next, conducting a thorough literature review to understand existing research on the topic; then, designing a research methodology to collect and analyze data; and finally, presenting the results, discussing their implications, and drawing conclusions.", "研究論文を書く過程には、いくつかの重要な段階がある。まず研究課題や問いを特定し、次にそのテーマに関する既存の研究を理解するために徹底的な文献調査を行い、さらにデータを収集・分析するための研究方法を設計し、最後に結果を示してその意味を考察し、結論を導く。"],
      ["Throughout this process, academic writers must follow formal writing conventions, use clear and precise language, and follow specific citation and formatting guidelines, such as APA, MLA, or Chicago style, to maintain academic integrity.", "この過程全体を通じて、学術的な書き手は正式な文章の慣習に従い、明確で正確な言葉を使い、学術的誠実性を保つために APA、MLA、Chicago スタイルなどの特定の引用・書式ガイドラインに従わなければならない。"]
    ],
    [
      ["In academic English, research paper writing requires writers to engage critically with sources, organize information logically, and present arguments supported by evidence.", "アカデミック英語において、研究論文の執筆では、書き手が情報源に批判的に向き合い、情報を論理的に整理し、根拠に裏付けられた議論を示すことが求められる。"],
      ["The goal is not just to summarize existing knowledge, but to analyze and synthesize information to generate new insights.", "目的は既存の知識を要約することだけではなく、情報を分析・統合して新たな洞察を生み出すことである。"],
      ["This type of writing helps foster a deeper understanding of complex issues and encourages scholarly communication within the academic community.", "この種の執筆は、複雑な問題へのより深い理解を促し、学術コミュニティ内での学術的コミュニケーションを促進する。"]
    ]
  ]}
],
    quizzes: [
      { title: "A. True or False", ja: "正誤問題",

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const host = document.getElementById("passages"), qhost = document.getElementById("quizzes");
let pinned = null, qSentences = {};
const all = k => host.querySelectorAll('.s[data-k="' + k + '"]');
function show(keys) {
  host.querySelectorAll(".s.on").forEach(e => e.classList.remove("on"));
  keys.forEach(k => all(k).forEach(e => e.classList.add("on")));
}
function rest() { show(pinned || []); }
function setPin(keys) {
  host.querySelectorAll(".s.pinned").forEach(e => e.classList.remove("pinned"));
  pinned = keys;
  if (keys) keys.forEach(k => all(k).forEach(e => e.classList.add("pinned")));
  rest();
}

function render(u) {
  pinned = null; qSentences = {};
  host.replaceChildren(); qhost.replaceChildren();
  document.getElementById("eyebrow").textContent = "Academic English · " + u.label;
  document.getElementById("utitle").textContent = u.title;
  document.querySelectorAll("#units button").forEach(b => b.setAttribute("aria-pressed", b.dataset.u === u.id));
  // Each quiz item may carry its own id (4th field, e.g. "(1)"); otherwise "Q" + running number.
  // Passage sentences point at items by that id, or by running number.
  const byId = {}, numToId = {};
  let c = 0;
  u.quizzes.forEach(q => q.items.forEach(it => { const id = it[3] || "Q" + (c + 1); numToId[++c] = id; byId[id] = it; }));
  const refId = r => typeof r === "number" ? numToId[r] : r;
  const badge = r => {
    const id = refId(r), it = byId[id], ok = it && it[1] === true, ng = it && it[1] === false;
    const b = el("span", "q" + (ok ? " t" : ng ? " f" : ""), id);
    b.title = id + (it ? "：" + (ok ? "True" : ng ? "False" : it[1]) : "");
    return b;
  };
  const jump = document.getElementById("jump"); jump.replaceChildren();
  u.passages.forEach((p, i) => {
    const pid = u.id + "-p" + i;
    const a = el("a", null, p.title.split("　")[0].replace("Reading ", "")); a.href = "#" + pid; jump.append(a);
    const sec = el("section", "passage"); sec.id = pid;
    const h = el("div", "p-head"); h.append(el("h2", null, p.title), el("span", "ja-title", p.ja)); sec.append(h);
    const ch = el("div", "colhead"); ch.append(el("div", null, "English"), el("div", null, "日本語訳")); sec.append(ch);
    p.paras.forEach((para, pi) => {
      const row = el("div", "row"), en = el("p", "en"), ja = el("p", "ja");
      const pno = "¶" + (pi + (p.start || 1)); en.append(el("span", "pn", pno)); ja.append(el("span", "pn", pno));
      para.forEach((s, si) => {
        const key = pid + "-" + pi + "-" + si;
        [[en, s[0]], [ja, s[1]]].forEach(([target, txt], side) => {
          const sp = el("span", "s", txt);
          sp.dataset.k = key; sp.tabIndex = 0; sp.setAttribute("role", "button");
          sp.setAttribute("aria-label", (side ? "和訳: " : "English: ") + txt);
          target.append(sp);
          if (side === 0 && s[2]) s[2].forEach(r => { target.append(badge(r)); (qSentences[refId(r)] ||= []).push(key); });
          if (!side) target.append(document.createTextNode(" "));
        });
      });
      row.append(en, ja); sec.append(row);
    });
    host.append(sec);
  });
  let n = 0;
  u.quizzes.forEach((q, qi) => {
    const sec = el("section", "quiz"); sec.id = u.id + "-q" + qi;
    const h = el("h2", null, q.title + "　"); h.append(el("span", "ja-title", q.ja + "（押すと根拠の文へ移動）")); sec.append(h);
    const a = el("a", null, q.short || q.title.split(".")[0] + ". 問題"); a.href = "#" + sec.id; jump.append(a);
    (q.prompt || []).forEach(([pen, pja]) => {
      const pr = el("div", "qprompt"); pr.append(el("span", "en", pen));
      if (pja) pr.append(el("span", "ja", pja));
      sec.append(pr);
    });
    const ol = el("ol");
    q.items.forEach(([txt, ans, jt, ownId]) => {
      const num = ++n, id = ownId || "Q" + num, li = el("li"), b = el("button");
      b.type = "button";
      const cls = ans === true ? "t" : ans === false ? "f" : "";
      const body = el("span", "txt"); body.append(el("span", null, txt), el("span", "qja", jt));
      b.append(el("span", "num", id), el("span", "ans " + cls, ans === true ? "True" : ans === false ? "False" : ans), body);
      b.addEventListener("click", () => {
        const keys = qSentences[id] || []; setPin(keys);
        const first = keys.length && all(keys[0])[0];
        if (first) first.scrollIntoView({ block: "center" });
      });
      li.append(b); ol.append(li);
    });
    sec.append(ol); qhost.append(sec);
  });
  const sa = el("a", null, "テストを解く"); sa.href = "#solver"; jump.append(sa);
  curUnit = u; solverUnitChanged();
  try { localStorage.setItem("unit2", JSON.stringify({ id: u.id, n: UNITS.length })); } catch (e) {}
}

// ---- Test solver: asks Claude with the current unit's sentences, shows answers with clickable evidence
let curUnit = null, svCtl = null, svImages = [], svBlocked = false;
const $ = id => document.getElementById(id);
const svKey = () => "solver-" + (curUnit ? curUnit.id : "");

function unitSentences(u) {
  const list = [];
  u.passages.forEach((p, i) => p.paras.forEach((para, pi) => para.forEach((s, si) => {
    list.push({ key: u.id + "-p" + i + "-" + pi + "-" + si, where: p.title.split("　")[0].replace("Reading ", "") + " ¶" + (pi + (p.start || 1)), en: s[0], ja: s[1] });
  })));
  return list;
}

function renderAnswers(data) {
  const out = $("sv-out"); out.replaceChildren();
  if (!data || !Array.isArray(data.items)) return;
  const byKey = Object.fromEntries(unitSentences(curUnit).map(s => [s.key, s]));
  data.items.forEach(it => {
    const card = el("div", "sv-card");
    card.append(el("div", "sv-q", (it.no ? it.no + ". " : "") + (it.question || "")));
    if (it.question_ja) card.append(el("div", "sv-qja", "（訳）" + it.question_ja));
    const ans = el("div", "sv-ans"); ans.append("答え：", el("b", null, String(it.answer ?? "")));
    if (it.answer_ja) ans.append(" ", el("span", "ja", "（" + it.answer_ja + "）"));
    card.append(ans);
    if (it.reason_ja) card.append(el("div", "sv-why", it.reason_ja));
    const keys = (Array.isArray(it.evidence) ? it.evidence : []).map(String).filter(k => byKey[k]);
    if (keys.length) {
      const ev = el("div", "sv-ev");
      keys.forEach(k => {
        const s = byKey[k], b = el("button");
        b.type = "button";
        b.append(el("small", null, "根拠：" + s.where + "（押すと本文へ）"), document.createTextNode(s.en));
        b.addEventListener("click", () => { setPin(keys); const t = all(k)[0]; if (t) t.scrollIntoView({ block: "center" }); });
        ev.append(b);
      });
      card.append(ev);
    } else {
      card.append(el("div", "sv-none", "本文中に直接の根拠が見つかりませんでした（一般知識からの回答）。"));
    }
    out.append(card);
  });
}

function solverUnitChanged() {
  $("sv-scope").textContent = curUnit.label + " の本文を根拠に回答";
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(svKey()) || "null"); } catch (e) {}
  $("sv-text").value = saved ? saved.q : "";
  $("sv-status").textContent = "";
  renderAnswers(saved && saved.a);
}

function showFiles() { $("sv-files").textContent = svImages.length ? svImages.map(f => f.name || "画像").join("、") : ""; }

const svMsg = {
  not_granted: "Claude の利用が許可されていません。", sampling_disabled: "このアカウントでは Claude を使えません。",
  rate_limited: "利用が混み合っています。少し待ってからもう一度押してください。", session_expired: "サインインし直してください。",
  invalid_json: "答えの形式が崩れました。もう一度「解く」を押してください。", refused: "この内容には回答できませんでした。問題文を見直してください。",
  prompt_too_large: "入力が長すぎます。問題を分けて貼り付けてください。", image_rejected: "この画像は使えません。別の画像を選んでください。",
  images_unavailable: "この環境では画像を送れません。問題文を貼り付けてください。"
};

(async () => {
  const sample = window.claude ? await window.claude.use("sample") : null;
  if (!sample) {
    $("sv-go").disabled = true;
    $("sv-status").textContent = "このページを claude.ai で開くと使えます。";
    return;
  }
  sample.limits().then(l => { if (l && l.images) { $("sv-file-wrap").hidden = false; $("sv-file").accept = l.images.mediaTypes.join(","); } }).catch(() => {});
  $("sv-file").addEventListener("change", e => { svImages = Array.from(e.target.files || []); showFiles(); });
  $("sv-text").addEventListener("paste", e => {
    const imgs = Array.from(e.clipboardData?.files || []).filter(f => f.type.startsWith("image/"));
    if (imgs.length && !$("sv-file-wrap").hidden) { svImages = svImages.concat(imgs); showFiles(); }
  });
  $("sv-clear").addEventListener("click", () => {
    $("sv-text").value = ""; svImages = []; $("sv-file").value = ""; showFiles();
    $("sv-out").replaceChildren(); $("sv-status").textContent = "";
    try { localStorage.removeItem(svKey()); } catch (e) {}
  });
  $("sv-stop").addEventListener("click", () => svCtl && svCtl.abort());
  $("sv-go").addEventListener("click", async () => {
    const q = $("sv-text").value.trim();
    if (!q && !svImages.length) { $("sv-status").textContent = "問題文を貼り付けるか、画像を追加してください。"; return; }
    const u = curUnit, sents = unitSentences(u);
    const prompt = [
      "You are helping a Japanese university student review an Academic English class (" + u.label + ": " + u.title + ").",
      "Answer the test questions below using the reading passage. For each question, find the sentence(s) in the passage that support the answer.",
      "", "PASSAGE SENTENCES (format: [key] (location) sentence):",
      sents.map(s => "[" + s.key + "] (" + s.where + ") " + s.en).join("\n"),
      "", "TEST QUESTIONS" + (svImages.length ? " (also shown in the attached image(s))" : "") + ":", q || "(see image)",
      "", "Reply with only JSON in this shape:",
      '{"items":[{"no":"1","question":"original question text (short)","question_ja":"Japanese translation of the question","answer":"the answer exactly as it should be written (e.g. True / (b) / a word for a blank / a short English answer)","answer_ja":"Japanese meaning of the answer (or empty)","reason_ja":"1-2 sentences in Japanese explaining why, referring to the evidence","evidence":["key", "..."]}]}',
      "Rules: use keys exactly as given; evidence may be [] only if the passage has no support. One item per question, in order. Keep reason_ja short."
    ].join("\n");
    svCtl = new AbortController();
    $("sv-go").disabled = true; $("sv-stop").hidden = false;
    $("sv-status").textContent = "考え中…（本文から根拠を探しています。30秒ほどかかることがあります）";
    try {
      const opts = { signal: svCtl.signal, cache: false };
      if (svImages.length) opts.images = svImages;
      const data = await sample.json(prompt, opts);
      if (curUnit !== u) return;
      renderAnswers(data);
      const n = data && Array.isArray(data.items) ? data.items.length : 0;
      $("sv-status").textContent = n ? n + " 問の答えを出しました。根拠を押すと本文で確認できます。" : "答えを読み取れませんでした。問題文を見直してください。";
      try { localStorage.setItem(svKey(), JSON.stringify({ q, a: data })); } catch (e) {}
    } catch (e) {
      $("sv-status").textContent = e && e.code === "cancelled" ? "停止しました。" : (svMsg[e && e.code] || "うまくいきませんでした。もう一度「解く」を押してください。");
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) svBlocked = true;
    } finally {
      $("sv-go").disabled = svBlocked;
      $("sv-stop").hidden = true; svCtl = null;
    }
  });
})();

const unitsNav = document.getElementById("units");
UNITS.forEach(u => { const b = el("button", null, u.label); b.type = "button"; b.dataset.u = u.id; b.addEventListener("click", () => render(u)); unitsNav.append(b); });
let start = UNITS[UNITS.length - 1];
try { const saved = JSON.parse(localStorage.getItem("unit2") || "null"); if (saved && saved.n === UNITS.length) start = UNITS.find(u => u.id === saved.id) || start; } catch (e) {}
render(start);

host.addEventListener("mouseover", e => { const s = e.target.closest(".s"); if (s) show([s.dataset.k]); });
host.addEventListener("mouseout", e => { const s = e.target.closest(".s"); if (s && !s.contains(e.relatedTarget)) rest(); });
host.addEventListener("focusin", e => { const s = e.target.closest(".s"); if (s) show([s.dataset.k]); });
host.addEventListener("focusout", rest);
function toggle(s) { const k = s.dataset.k; setPin(pinned && pinned.length === 1 && pinned[0] === k ? null : [k]); }
host.addEventListener("click", e => { const s = e.target.closest(".s"); if (s) toggle(s); });
host.addEventListener("keydown", e => { const s = e.target.closest(".s"); if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(s); } });
</script>
